<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samengestelde slide</title>
<style>
/* Een samengestelde slide: links het paneel van slide L, rechts het paneel van slide R.
   Alle slides delen hetzelfde kader: kop bovenaan, linkerkolom 1/3, rechterdeel 2/3, ticker onderaan.
   Slide L wordt volledig getoond (kop, links, ticker); bovenop het rechterdeel komt een venster
   op dezelfde plek van slide R. Zo blijft alles exact uitgelijnd en hoeft geen slide te veranderen. */
:root{--kop:10.648vh;--ticker:6.204vh;--links:33.3333vw}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
iframe{border:0;display:block;width:100vw;height:100vh}
#basis{position:absolute;inset:0}
#venster{position:absolute;top:var(--kop);left:var(--links);right:0;bottom:var(--ticker);overflow:hidden;background:#fff}
#venster iframe{position:absolute;top:calc(-1 * var(--kop));left:calc(-1 * var(--links))}
</style>
</head>
<body>
<iframe id="basis" title="" scrolling="no"></iframe>
<div id="venster"><iframe id="rechts" title="" scrolling="no"></iframe></div>
<script>
const Q = new URLSearchParams(location.search), n = Date.now();
const vers = u => u ? u + (u.includes("?") ? "&" : "?") + "t=" + n : "about:blank";
const L = Q.get("l"), R = Q.get("r");
document.getElementById("basis").src = vers(L || R);
if (R) document.getElementById("rechts").src = vers(R); else document.getElementById("venster").remove();
/* het label rechts in de kop hoort bij het rechterpaneel: overnemen van slide R */
const kop = () => { try {
  const van = document.getElementById("rechts").contentDocument.querySelector("header .day"),
        naar = document.getElementById("basis").contentDocument.querySelector("header .day");
  if (van && naar && van.textContent) naar.textContent = van.textContent;
} catch (e) {} };
document.querySelectorAll("iframe").forEach(f => f.addEventListener("load", () => { kop(); setTimeout(kop, 1500); }));
</script>
</body>
</html>
