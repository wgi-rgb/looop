<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VVS Schietoefeningen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<style>
/* ------------------------------------------------------------------
   Ontwerpregels (gelden voor dit hele scherm)
   1. Eén letter: Montserrat. Drie gewichten: 600 tekst, 700 labels, 800 waarden.
   2. Vaste typeschaal: label 1.4vh · tekst 1.8vh · klein getal 2.6vh · titel 3vh · groot getal 5vh · klok 8vh.
   3. Vaste ruimteschaal: 0.8 · 1.6 · 2.4 · 4 · 6.4 vh. Geen losse marges daarbuiten.
   4. Alles links uitgelijnd op dezelfde kantlijn; centreren alleen binnen een vorm (roos, tegel, tag).
   5. Kleur: zwart, grijs, wit, merkgeel. Windy-kleuren uitsluitend als gegevenskleur voor wind.
   6. Geen contouren, geen schaduwen. Vlakken scheiden elkaar door kleur en witruimte.
   7. Elke eenheid en elk gegeven één keer: richting één keer, "kn" één keer.
   ------------------------------------------------------------------ */
:root{
  --bg:#ffffff; --fg:#070504; --muted:#6e6a66; --soft:#a8a49f; --line:#e8e6e1; --panel:#f4f3ef; --tag:#e9e8e3;
  --yellow:#F8E700; --frost:#5b62b3;
  --s1:.8vh; --s2:1.6vh; --s3:2.4vh; --s4:4vh; --s5:6.4vh;
  --t-label:1.4vh; --t-text:1.8vh; --t-num-s:2.6vh; --t-title:3vh; --t-num-l:5vh; --t-clock:10vh;
  --font:"Montserrat",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;font-variant-numeric:tabular-nums}
svg text{font-family:var(--font)}
.screen{display:grid;grid-template-rows:auto 1fr;height:100%}

/* header: identiek op alle schermen */
header{display:flex;align-items:center;justify-content:space-between;padding:2.2vh 3.5vw;border-bottom:1px solid var(--line)}
.logo{height:4.2vh;width:auto;display:block}
header .day{font-size:1.8vh;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}

main{display:grid;grid-template-columns:1fr 2fr;min-height:0}
.label{font-size:var(--t-label);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ---------- links: klok en weer ---------- */
.side{background:var(--panel);padding:var(--s5) 3vw var(--s4) 3.5vw;display:grid;align-content:start;min-width:0}

.clockrow{display:flex;align-items:center;height:9vh}
.time{font-size:var(--t-clock);font-weight:800;line-height:1;letter-spacing:-.03em}
.time .colon{transition:opacity .25s;display:inline-block;margin:0 .12em;transform:translateY(-.06em)}   /* ademruimte rond de dubbele punt, optisch gecentreerd op de cijfers */
.date{display:flex;align-items:center;gap:1vw;margin-top:var(--s3);height:4.4vh;font-size:var(--t-title);font-weight:700}
.date i{width:2.4vw;height:.6vh;background:var(--yellow);flex:none}

.divider{height:3px;background:#ffffff;margin:var(--s3) 0 var(--s4)}

.section .label{margin-bottom:var(--s2)}
/* weer nu: bovenaan het weerbeeld (symbool + temperatuur + omschrijving), gecentreerd;
   daaronder twee even brede tags in de stijl van de tegels: wind (Windy-kleur) en golfhoogte */
.wind{display:grid;gap:var(--s4)}
.hero{display:flex;align-items:stretch;justify-content:flex-start;gap:2vw}
.hero svg.wxbig{width:23vh;height:20vh;flex:none}   /* bovenaan het kader is bijna altijd lucht: mag in de witruimte onder de lijn schuiven */   /* viewBox = grootste omtrek van alle weersymbolen samen: niets steekt uit, witruimte altijd gelijk */
.hero .txt{min-width:0;display:grid;gap:1vh;align-self:flex-end;padding-bottom:calc((58 - var(--wxb,50)) / 53 * 20vh - .5vh)}   /* onderkant tekst = onderkant van de wolk (of zon) */
.hero .temp{font-size:6.4vh;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero .desc{font-size:2.4vh;line-height:1.15;font-weight:700;color:var(--muted)}   /* lange omschrijving loopt door op een tweede regel */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:.8vw}
.fact{display:flex;align-items:center;justify-content:center;gap:.9vw;height:7vh;border-radius:999px;font-weight:800;white-space:nowrap}
.fact .v{font-size:4.4vh;line-height:1;letter-spacing:-.02em}
.fact small{font-size:1.8vh;font-weight:700;align-self:center;margin-left:-.4vw;opacity:.7}
.bigchip svg{width:2.6vh;height:2.6vh;fill:currentColor}
.bigchip .d{font-size:1.9vh;letter-spacing:.06em;min-width:4.4vh;text-align:right}   /* vaste breedte: ook NNW past */
.bigchip .v{min-width:4.4vh;text-align:left}
.fact.wave{background:#ffffff;color:var(--black,#070504)}
.fact .wv{width:3.4vh;height:3.4vh;fill:none;stroke:#2f6fb3;stroke-width:2.4;stroke-linecap:round}

.next{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw;margin-top:var(--s4)}
.tile{background:var(--bg);border-radius:1.2vh;padding:var(--s2) 0;display:grid;justify-items:center;gap:var(--s1)}
.tile .t{font-size:var(--t-text);font-weight:600;color:var(--muted)}
.tile svg.wx{width:6.4vh;height:6.4vh}
.tile .temp{font-size:var(--t-num-s);font-weight:800;line-height:1}
.chip{display:inline-flex;align-items:center;gap:.4vw;height:3.2vh;padding:0 .9vw;border-radius:999px;font-size:var(--t-text);font-weight:800}
.chip svg{width:1.6vh;height:1.6vh;fill:currentColor}

/* ---------- rechts: programma ---------- */
.prog{padding:var(--s5) 3.5vw var(--s4) 3vw;display:grid;grid-template-rows:auto auto 1fr;min-width:0;min-height:0}
.title{margin-top:11.4vh;height:4.4vh;display:flex;align-items:center;gap:1vw;margin-bottom:var(--s4);font-size:var(--t-title);font-weight:700}
.title h2{margin:0;font:inherit}
.title i{width:2.4vw;height:.6vh;background:var(--yellow);flex:none}
.cols,.r{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:1.2vw;align-items:center}
.cols{padding:0 0 var(--s2) 1.5vw}
.list{display:grid;gap:var(--s1);align-content:start;min-height:0}
.pill{display:flex;align-items:center;gap:1vw;height:4.6vh;padding:0 1.5vw;border-radius:999px;min-width:0;font-weight:800;font-size:2.1vh}   /* vaste rijhoogte: er passen altijd 10 lijnen */
.pill svg{width:2.8vh;height:2.8vh;flex:none;fill:currentColor}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.boot{background:var(--fg);color:#ffffff;text-transform:uppercase;letter-spacing:.06em}
.pill.lesgever{background:var(--tag);color:var(--fg)}
.pill.cursus{background:var(--yellow);color:var(--fg)}
.pill svg.line{fill:none;stroke:currentColor;stroke-width:16;stroke-linejoin:round;stroke-linecap:round}
.frost{color:var(--frost)!important}   /* vriestemperaturen (0° en lager) in ijs-indigo: duidelijk anders dan het blauw van neerslag */
.empty{font-size:var(--t-title);font-weight:700;color:var(--muted)}
/* ticker: smalle gele band onderaan, tekst loopt van rechts naar links */
.screen{grid-template-rows:auto 1fr auto !important}
.ticker{height:6.2vh;background:var(--yellow);color:var(--fg);display:flex;align-items:center;overflow:hidden;position:relative}
/* (label niet gebruikt) */
.ticker .lbl{flex:none;height:100%;display:flex;align-items:center;gap:.8vw;padding:0 1.6vw 0 3.5vw;background:var(--yellow);position:relative;z-index:1;font-size:1.5vh;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.ticker .lbl::after{content:"";width:2px;height:2.6vh;background:rgba(7,5,4,.25);margin-left:1vw}
.ticker .run{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.ticker .track{display:flex;white-space:nowrap;will-change:transform;font-size:1.9vh;font-weight:700;letter-spacing:.04em}
.ticker .track span{padding-right:6vw}
.ticker .track span{padding:0}
/* scheiding tussen berichten: één eenvoudige punt */
.ticker .track i{display:inline-flex;align-items:center;padding:0 .9vw 0 8vw}
.ticker .track i svg{height:1.1vh;width:auto;fill:#ffffff}   /* wit puntje net voor elk bericht */
/* megafoon rechts, met de opening naar links: de berichten komen eruit en lopen naar links */
.ticker .mouth{flex:none;height:100%;display:flex;align-items:center;gap:.8vw;padding:0 3.5vw 0 .4vw;background:var(--yellow);font-size:1.9vh;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.ticker .mouth svg{width:3.8vh;height:3.8vh;fill:currentColor}
.ticker .run{padding-left:3.5vw}


/* programma met ticker: iets compacter verticaal zodat alles boven de ticker past */
.side{padding-top:var(--s4) !important;padding-bottom:var(--s3) !important}
.prog{padding-top:var(--s4) !important;padding-bottom:var(--s3) !important}
.title{margin-top:11.4vh}
.divider{margin:var(--s3) 0 var(--s3) !important}
.wind{gap:var(--s3) !important}
.next{margin-top:var(--s3) !important}

/* lichter: zelfde gewichten als het weerbericht (semi-bold), klok en temperatuur iets minder zwaar */
.time{font-weight:700}
.date,.title{font-weight:600}
.hero .temp{font-weight:700}
.hero .desc{font-weight:600}
.fact{font-weight:700}
.fact small{font-weight:600}
.tile .temp{font-weight:700}
.chip{font-weight:700}
.label{font-weight:600}
/* grid lichter: boten niet meer zwart maar lichtgrijs, lesgevers zonder vlak, cursussen geel; tekst semi-bold */
.pill{font-weight:600}
.pill.boot{background:var(--tag);color:var(--fg);letter-spacing:.08em}
.pill.lesgever{background:none;padding-left:.4vw}
.pill.cursus{background:var(--yellow);color:var(--fg)}

/* klok bovenaan links; datum staat rechts vóór de titel, met de gele streep ertussen, op de hoogte van de klok */
.side .date{display:none}
.title{margin-top:5.3vh !important;gap:1.4vw;align-items:baseline !important;margin-bottom:var(--s5) !important}   /* basislijn van de titel = basislijn van de klok */
.title i{position:relative;top:0}   /* streep staat op de basislijn van de tekst */
.title .tdate{white-space:nowrap}
/* tags: boot donkergrijs, instructeur lichtgrijs, cursus geel — drie duidelijke, lichte vlakken */
.pill.boot{background:#4f4b47 !important;color:#ffffff !important}
.pill.lesgever{background:#dedbd4 !important;color:var(--fg) !important;padding-left:1.5vw !important}
/* lijn onder de klok even dun als de lijn onder de header */
.divider{height:1px !important;background:var(--line) !important}
/* meer ademruimte in de linkerkolom */
.divider{margin:var(--s2) 0 var(--s5) !important}   /* lijn dichter onder de klok */
.wind{gap:var(--s5) !important}
.next{margin-top:var(--s4) !important}
.hero .place{font-size:2.2vh;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.4vh}
/* uurtegels: meer lucht tussen temperatuur en windtag */
.tile .chip{margin-top:var(--s1)}
.tile{padding:var(--s3) 0 !important}
/* schietsectoren: kaart links, status vandaag + planning rechts */
:root{--red:#e5483b;--sea:#e3ecf2}
.sz{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:1.2vw;align-items:start}
.map{position:relative;border-radius:1.6vh;overflow:hidden;background:var(--sea)}
.map svg{display:block;width:100%;height:auto}
.map .sec{fill:rgba(7,5,4,.06)}
.map .act{fill:var(--red);opacity:.3}
.map .land{fill:var(--panel)}
.map .pd{fill:var(--fg)}
.map .pl{font-family:var(--font);font-size:15px;font-weight:600;fill:var(--fg)}
.map .wtr{fill:var(--sea)}
.map .strand{fill:#efe8d6}
.map .wad{fill:#cfdce6}
.map .kamp rect{fill:#4f4b47}
.map .kamp .wiel{fill:#fff;stroke:#4f4b47;stroke-width:1.6}
.map .kamp .zone{fill:rgba(194,56,44,.14);stroke:#c2382c;stroke-width:.9;stroke-dasharray:2.5 2}
.map .kamp text{font-family:var(--font);font-size:10.5px;font-weight:700;fill:#c2382c;paint-order:stroke;stroke:rgba(255,255,255,.7);stroke-width:3px}
.map .rad{stroke:#fff;stroke-width:.9}
.map .radc{stroke:rgba(7,5,4,.16);stroke-width:1.9}
.map .mp path{stroke:#6e6a66;stroke-width:1.4}
.map .mp text{font-family:var(--font);font-size:11px;font-weight:600;fill:#8f8a84}
.map .leid{fill:none;stroke:#8f8a84;stroke-width:1.4;stroke-dasharray:5 4}
.map .sb rect{fill:#9db3c4}
.map .b{stroke:#fff;stroke-width:1.5}
.map .bl{font-family:var(--font);font-size:13px;font-weight:500;fill:#6e6a66;paint-order:stroke;stroke:var(--sea);stroke-width:4px;stroke-linejoin:round}
.map .rl{font-family:var(--font);font-size:16px;font-weight:700;fill:#4a4643;paint-order:stroke;stroke:rgba(255,255,255,.6);stroke-width:4px}
.map .gl{stroke:#4f4b47;stroke-width:.9;stroke-dasharray:4 3.5}
.map .gt{font-family:var(--font);font-size:21px;font-weight:700;fill:var(--fg);paint-order:stroke;stroke:var(--sea);stroke-width:5px}
.map .kd{fill:none;stroke:var(--fg);stroke-width:1.5}
.map .isea{fill:var(--sea)}
.map .iland{fill:#ebe9e3}
.map .isec{fill:rgba(7,5,4,.08)}
.map .ibox{fill:none;stroke:rgba(7,5,4,.12);stroke-width:1}
.map .isec.on{fill:var(--red);fill-opacity:.3}
.map .pier.ip{stroke-width:2.2}
.map .gs{font-size:15px}
.map .pier{fill:none;stroke:#8f8a84;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.map .il{font-family:var(--font);font-size:12px;font-weight:600;fill:#4a4643}
.map .it{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;fill:var(--muted)}
.map .sb text{font-family:var(--font);font-size:13px;font-weight:600;fill:#8aa3b6}
.lft{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);min-width:0}
.legend{display:flex;justify-content:space-between;gap:1.6vw;padding:0 .4vw}
.legend .r{display:flex;align-items:center;gap:.6vw;font-size:1.6vh;font-weight:700;white-space:nowrap}
.legend .r span{font-weight:500;color:var(--muted)}
.flag{height:4.2vh;width:calc(4.2vh*16/34);flex:none;display:block}
.flag.sm{height:3.2vh;width:calc(3.2vh*16/34)}
.info{display:grid;gap:var(--s3);align-content:start}
.info{gap:var(--s3);min-width:0;grid-template-columns:minmax(0,1fr)}
.stat{display:flex;align-items:center;gap:.8vw;font-size:1.8vh;font-weight:700;padding:1.3vh 1.4vw;background:var(--panel);border-radius:1.2vh}
.stat.on{background:#fbe4e1}
.stat i{width:1.3vh;height:1.3vh;border-radius:50%;background:#b9b5ae;flex:none}
.stat.on i{background:var(--red)}
.today{position:relative;background:var(--panel);border-radius:1.2vh;padding:var(--s3) calc(10vh*110/230 + 3vw) var(--s3) 1.4vw;display:grid;gap:1.4vh;align-content:center;min-height:16vh}
.today.on{background:#fbe4e1}
.k{font-size:1.5vh;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.today .vl{position:absolute;right:1.4vw;top:50%;transform:translateY(-50%);height:10vh;width:calc(10vh*110/230)}
.today .dt{font-size:2.2vh;font-weight:700;line-height:1.2}
.today .big{font-size:3.1vh;font-weight:700;line-height:1.1}
.today .sub{font-size:1.9vh;font-weight:500;line-height:1.4;color:#4a4643}
.today .sub b{font-weight:700;color:var(--fg)}
.plan{display:grid;gap:var(--s2);min-width:0}
.plan>.k{padding-left:1.4vw}
#plan{display:grid;gap:.9vh;min-width:0}
.plan .row{display:grid;grid-template-columns:1fr auto;gap:1vw;align-items:center;padding:1.3vh 1.4vw;background:var(--panel);border-radius:1.2vh;font-size:1.8vh;min-width:0;white-space:nowrap}
.plan .row b{font-weight:600}
.plan .row span{font-weight:500;color:var(--muted)}
.src{margin-top:0;padding-left:1.4vw;line-height:1.5;font-size:1.1vh;font-weight:400;color:var(--soft)}

/* ===== gedeeld kader: identiek op alle slides =====
   kop 3vh boven en onder · inhoud start en eindigt op dezelfde hoogte links en rechts
   · onderaan overal 4vh witruimte boven de gele balk · bron gecentreerd in die witruimte */
header{padding:3vh 3.5vw !important}
.logo{height:4.6vh !important}
.side{display:flex !important;flex-direction:column;padding-top:var(--s4) !important;padding-bottom:var(--s4) !important}
.side>.next{margin-top:auto !important}
.prog{position:relative;padding-top:var(--s4) !important;padding-bottom:var(--s4) !important}
.prog>.src{position:absolute;right:3.5vw;bottom:calc(var(--s4) / 2);transform:translateY(50%);margin:0 !important}
.prog{grid-template-rows:auto minmax(0,1fr) !important}
.sz{height:100%;align-items:stretch !important}
.lft{height:100%;grid-template-rows:minmax(0,1fr)}
.map{height:100%}
.map svg{height:100% !important}
.info{align-content:start}
</style>
</head>
<body>

<script>
/* Vandaag op het water. Tijdelijk vast in dit bestand; later komt deze lijst automatisch uit de agenda. */
const PROGRAMMA=[
  {boot:"Blauwvoet", lesgever:"Peter Van Giel", cursus:"Kustvaart"},
  {boot:"Breydel",   lesgever:"Eric Michiels",  cursus:"Initiatie"},
  {boot:"Gust",      lesgever:"Bert Baeyens",   cursus:"Zeevaart"}
];
const LAT=51.17, LON=2.72;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* iconen: Phosphor Icons (bold), MIT-licentie, phosphoricons.com */
/* Motorboten krijgen het motorboot-icoon; alle andere boten het zeilboot-icoon. */
const MOTORBOTEN=["Basiel"];
const ICON={
  motor:`<svg class="line" viewBox="0 0 256 256"><g transform="translate(0 22)"><path d="M20 150H236L214 192Q210 200 200 200H44Q36 200 32 192Z"/><path d="M70 150V110Q70 102 78 102H140L172 150"/><path d="M110 102V150"/></g></svg>`,
  boot:`<svg viewBox="0 0 256 256"><path d="M247.21,172.53A8,8,0,0,0,240,168H144V144h72a8,8,0,0,0,5.92-13.38L144,44.91V8a8,8,0,0,0-14.21-5l-104,128A8,8,0,0,0,32,144h96v24H16a8,8,0,0,0-6.25,13l29.6,37a15.93,15.93,0,0,0,12.49,6H204.16a15.93,15.93,0,0,0,12.49-6l29.6-37A8,8,0,0,0,247.21,172.53ZM197.92,128H144V68.69ZM48.81,128,128,30.53V128Zm155.35,80H51.84l-19.2-24H223.36Z"/></svg>`,
  lesgever:`<svg viewBox="0 0 256 256"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/></svg>`,
  cursus:`<svg viewBox="0 0 256 256"><path d="M232,48H160a40,40,0,0,0-32,16A40,40,0,0,0,96,48H24a8,8,0,0,0-8,8V200a8,8,0,0,0,8,8H96a24,24,0,0,1,24,24,8,8,0,0,0,16,0,24,24,0,0,1,24-24h72a8,8,0,0,0,8-8V56A8,8,0,0,0,232,48ZM96,192H32V64H96a24,24,0,0,1,24,24V200A39.81,39.81,0,0,0,96,192Zm128,0H160a39.81,39.81,0,0,0-24,8V88a24,24,0,0,1,24-24h64Z"/></svg>`
};

function render(){
  const L=$("list");L.innerHTML="";
  if(!PROGRAMMA.length){L.innerHTML=`<div class="empty">Vandaag geen boten op het water.</div>`;return;}
  PROGRAMMA.forEach(p=>{const r=document.createElement("div");r.className="r";
    r.innerHTML=`<div class="pill boot">${MOTORBOTEN.some(m=>m.toLowerCase()===String(p.boot).toLowerCase())?ICON.motor:ICON.boot}<span>${esc(p.boot)}</span></div><div class="pill lesgever">${ICON.lesgever}<span>${esc(p.lesgever)}</span></div><div class="pill cursus">${ICON.cursus}<span>${esc(p.cursus)}</span></div>`;
    L.appendChild(r);});
}

/* ---------- klok ---------- */
function tick(){const n=new Date(),p=v=>String(v).padStart(2,"0");
  $("time").innerHTML=`${p(n.getHours())}<span class="colon" style="opacity:${n.getSeconds()%2?1:.15}">:</span>${p(n.getMinutes())}`;
  const d=n.toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"});$("date").textContent=d.charAt(0).toUpperCase()+d.slice(1);const td=$("tdate");if(td)td.textContent=d.charAt(0).toUpperCase()+d.slice(1);}

/* ---------- weer ---------- */
const WMO={0:"Helder",1:"Overwegend helder",2:"Half bewolkt",3:"Bewolkt",45:"Mist",48:"Mist",51:"Lichte motregen",53:"Motregen",55:"Motregen",56:"IJzel",57:"IJzel",61:"Lichte regen",63:"Regen",65:"Hevige regen",66:"IJsregen",67:"IJsregen",71:"Lichte sneeuw",73:"Sneeuw",75:"Hevige sneeuw",77:"Sneeuw",80:"Lichte buien",81:"Buien",82:"Zware buien",85:"Sneeuwbuien",86:"Sneeuwbuien",95:"Onweer",96:"Onweer met hagel",99:"Onweer met hagel"};
const DIRS=["N","NNO","NO","ONO","O","OZO","ZO","ZZO","Z","ZZW","ZW","WZW","W","WNW","NW","NNW"];
const dirName=d=>DIRS[Math.round(d/22.5)%16];
/* Windy-kleurschaal, wind in knopen */
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb=a=>`rgb(${a.map(v=>Math.round(v)).join(",")})`;
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const WS=[[0,"#ffffff"],[4,"#ffffff"],[7,"#a9e7fb"],[11,"#45d84a"],[17,"#c4ea2e"],[22,"#f6a11c"],[28,"#ef5627"],[34,"#df1f3a"],[41,"#c2187a"],[48,"#8e24aa"]].map(([v,c])=>[v,hex(c)]);
const WIND=v=>{if(v<=WS[0][0])return WS[0][1];for(let i=1;i<WS.length;i++)if(v<=WS[i][0]){const[a,ca]=WS[i-1],[b,cb]=WS[i];return mix(ca,cb,(v-a)/(b-a));}return WS[WS.length-1][1];};
const lum=c=>0.299*c[0]+0.587*c[1]+0.114*c[2];
const ink=c=>lum(c)<140?"#ffffff":"#070504";
/* bijna windstil = wit bij Windy; op een witte of grijze ondergrond tonen we dan een heel lichte blauwtint
   (loopt vloeiend over in het lichtblauw van 7 kn en valt niet weg tegen de grijze nachtkolommen) */
const CALM=hex("#dcebf5");
const windFill=kn=>kn>=7?WIND(kn):mix(CALM,WIND(7),Math.max(0,(kn-4)/3));
/* pijl die meewaait met de wind (zoals op Windy) */
const ARROW=`<svg viewBox="0 0 24 24"><path d="M12 2l7.5 9H14v11h-4V11H4.5z"/></svg>`;
const arrow=dirFrom=>ARROW.replace('<svg ',`<svg style="transform:rotate(${dirFrom+180}deg)" `);

/* vlakke weericonen, zonder contouren */
function icon(code,isDay=true){
  const sun=`<circle cx="32" cy="30" r="11" fill="#f7c331"/>`+[0,45,90,135,180,225,270,315].map(a=>`<rect x="30.5" y="8" width="3" height="6" rx="1.5" fill="#f7c331" transform="rotate(${a} 32 30)"/>`).join("");
  const moon=`<path d="M29.71 16.06A15 15 0 1 0 45.17 35.93A13 13 0 0 1 29.71 16.06Z" fill="#f1d27a"/>`;   // volle, zachtgele maansikkel
  const cloud=(x=0,y=0,f="#c9cfd6")=>`<path transform="translate(${x} ${y})" d="M19 48h28a9 9 0 0 0 1-18 13 13 0 0 0-25-3 10 10 0 0 0-4 21z" fill="${f}"/>`;
  const drops=(n,h=7)=>[[24,46],[33,48],[42,46]].slice(0,n).map(([x,y])=>`<rect x="${x}" y="${y}" width="3" height="${h}" rx="1.5" fill="#2e86de" transform="rotate(20 ${x} ${y})"/>`).join("");
  const bolt=`<path transform="translate(0 -6)" d="M35 44l-7 11h6l-3 9 9-13h-6l3-7z" fill="#f7c331"/>`;
  const fog=`<rect x="12" y="46" width="40" height="3" rx="1.5" fill="#aeb6bf"/><rect x="16" y="52" width="32" height="3" rx="1.5" fill="#aeb6bf"/>`;
  const snow=[[23,50],[33,53],[43,50]].map(([x,y])=>`<g transform="translate(${x} ${y})" stroke="#8b93cf" stroke-width="1.6" stroke-linecap="round"><path d="M0-3.6V3.6M-3.1-1.8L3.1 1.8M-3.1 1.8L3.1-1.8"/></g>`).join("");   // sneeuwsterretjes
  const sky=isDay?sun:moon;
  if(code===0)return sky;
  if(code===1)return `<g transform="translate(-5 -1)">${sky}</g>`+cloud(8,6,"#dfe3e8");
  if(code===2)return `<g transform="translate(-6 -3)">${sky}</g>`+cloud(4,4);
  if(code===3)return cloud(0,2,"#aeb6bf");
  if(code===45||code===48)return cloud(0,-6)+fog;
  if(code>=95)return cloud(0,-8,"#8d96a0")+bolt;
  if((code>=71&&code<=77)||code===85||code===86)return cloud(0,-6)+snow;
  if(code>=80)return `<g transform="translate(-6 -3)">${sky}</g>`+cloud(2,-6,"#aeb6bf")+drops(code>=82?3:2);
  if(code>=61)return cloud(0,-6,"#aeb6bf")+drops(code>=63?3:2);
  if(code>=51)return cloud(0,-6,"#aeb6bf")+drops(3,4);   // motregen: drie korte druppels
  return sky;
}

/* wind nu: grote tag in dezelfde opbouw als de tegels: richting in letters (waar de wind vandaan komt),
   pijl (waarheen hij waait) en de snelheid, in de Windy-kleur.
   Windstoten: na 10 s loopt het getal in ruim 2 s op tot de windstoot en kleurt de tag mee, houdt even vast,
   zakt terug, en na 10 s pauze begint het opnieuw. */
function iconBottom(code,isDay){
  if(code===0)return isDay?41:46;
  if(code===1)return 54; if(code===2)return 52; if(code>=80&&code<=82)return 42; if(code===3)return 50;
  if(code>=95)return 40;   // (omtrek alle symbolen: x 4–64.5, y 2–58)
  if(code>=45)return 42;      // mist, motregen, regen, sneeuw, buien: wolk staat hoger
  return 41;
}
let gustTimer=null,gustRaf=null;
function drawRose(dir,kn,gust){
  const el=$("wchip");
  el.innerHTML=`<span class="d">${dirName(dir)}</span>${arrow(dir)}<span class="v" id="wval">${Math.round(kn)}</span>`;
  const paint=v=>{const c=windFill(v);el.style.background=rgb(c);el.style.color=ink(c);$("wval").textContent=Math.round(v);};
  paint(kn);
  clearTimeout(gustTimer);cancelAnimationFrame(gustRaf);
  if(gust<=kn+0.5||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;   // zacht op- en uitlopen
  const tween=(from,to,ms,done)=>{const t0=performance.now();
    const step=now=>{const t=Math.min(1,(now-t0)/ms);paint(from+(to-from)*ease(t));if(t<1)gustRaf=requestAnimationFrame(step);else done();};
    gustRaf=requestAnimationFrame(step);};
  const cycle=()=>{gustTimer=setTimeout(()=>tween(kn,gust,2200,()=>{gustTimer=setTimeout(()=>tween(gust,kn,1200,cycle),1200);}),10000);};
  cycle();
}

async function loadWx(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m&wind_speed_unit=kn&timezone=Europe%2FBrussels&forecast_days=2`);
    const d=await r.json();if(!r.ok||!d.current)throw 0;const c=d.current,h=d.hourly;
    $("nowicon").innerHTML=icon(c.weather_code,!!c.is_day);document.querySelector(".hero").style.setProperty("--wxb",iconBottom(c.weather_code,!!c.is_day));
    fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&current=wave_height`)
      .then(x=>x.json()).then(m=>{if(m.current&&m.current.wave_height!=null)$("wave").textContent=m.current.wave_height.toFixed(1).replace(".",",");}).catch(()=>{});
    $("nowtemp").textContent=String(Math.round(c.temperature_2m)).replace("-","−")+"°";$("nowdesc").textContent=WMO[c.weather_code]||"";
    drawRose(c.wind_direction_10m,c.wind_speed_10m,c.wind_gusts_10m);
    // komende uren: +3, +6, +9, +12
    const now=new Date();let i=h.time.findIndex(t=>new Date(t)>now);if(i<0)i=0;
    $("next").innerHTML=[2,5,8,11].map(o=>{const j=i+o;if(j>=h.time.length)return "";const v=h.wind_speed_10m[j],col=windFill(v);
      return `<div class="tile"><div class="t">${h.time[j].slice(11,16)}</div><svg class="wx" viewBox="0 0 64 64">${icon(h.weather_code[j],!!h.is_day[j])}</svg><div class="temp">${String(Math.round(h.temperature_2m[j])).replace("-","−")}°</div><div class="chip" style="background:${rgb(col)};color:${ink(col)}">${arrow(h.wind_direction_10m[j])}${Math.round(v)}</div></div>`;}).join("");
  }catch(e){/* laatste waarden blijven staan */}
}

/* ---------- ticker ---------- */
/* Berichten die onderaan voorbijlopen. Later te beheren via een gedeeld document of de agenda. */
const BERICHTEN=[
  "Vaargeul Nieuwpoort gestremd van zaterdag 17 oktober tot 2 november",
  "Restaurant 't Galjoen is gesloten van maandag 5 tot woensdag 7 november - reservaties zijn verplaatst naar Restaurant De Vierboete :-)"
];
const TICKER_SNELHEID=75;
const MORSE=`<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4"/></svg>`;   // eenvoudige punt tussen de berichten
const MEGAFOON=`<svg viewBox="0 0 256 256"><path d="M228.54,86.66l-176.06-54A16,16,0,0,0,32,48V192a16,16,0,0,0,16,16,16,16,0,0,0,4.52-.65L136,181.73V192a16,16,0,0,0,16,16h32a16,16,0,0,0,16-16v-29.9l28.54-8.75A16.09,16.09,0,0,0,240,138V102A16.09,16.09,0,0,0,228.54,86.66ZM136,165,48,192V48l88,27Zm48,27H152V176.82L184,167Zm40-54-.11,0L152,160.08V79.92l71.89,22,.11,0v36Z"/></svg>`;   // nieuwsicoon tussen de berichten   // pixels per seconde: rustig leesbaar op tv-afstand
function startTicker(){
  const tr=$("track");if(!tr)return;$("mouth").innerHTML=MEGAFOON;
  const one=BERICHTEN.map(b=>`<i>${MORSE}</i><span>${b.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</span>`).join("");
  tr.innerHTML=one;const w=tr.scrollWidth||1,box=tr.parentElement.clientWidth;
  const reps=Math.max(2,Math.ceil(box/w)+1);tr.innerHTML=one.repeat(reps);
  /* CSS-animatie i.p.v. JavaScript: loopt op de grafische kaart, ook vloeiend op een trage tv */
  const k=document.createElement("style");k.textContent=`@keyframes tickerLoop{from{transform:translate3d(0,0,0)}to{transform:translate3d(${-w}px,0,0)}}`;document.head.append(k);
  tr.style.animation=`tickerLoop ${w/TICKER_SNELHEID}s linear infinite`;
}
document.fonts&&document.fonts.ready?document.fonts.ready.then(startTicker):startTicker();
/* ---------- mededeling ---------- */
/* Inhoud van de mededeling. Pas de teksten hier aan; later kan dit uit een gedeeld document komen. */
/* Planning zeewaartse schietoefeningen Lombardsijde — bron: mil.be (Tirmer sept 2026, 14/09 – 18/12/2026).
   Elke periode: [sector, eerste dag, laatste dag]; telkens 08:00 – 16:00 op weekdagen. */
const SCHIETPLAN=[
 ["M","2026-09-14","2026-09-18"],["G","2026-09-21","2026-09-25"],["M","2026-09-28","2026-10-02"],
 ["K","2026-10-05","2026-10-09"],["K","2026-10-12","2026-10-16"],["M","2026-10-19","2026-10-23"],
 ["K","2026-10-26","2026-10-30"],["K","2026-11-09","2026-11-09"],["M","2026-11-12","2026-11-13"],
 ["K","2026-11-16","2026-11-17"],["M","2026-11-18","2026-11-20"],["K","2026-11-23","2026-11-27"],
 ["K","2026-11-30","2026-12-04"],["K","2026-12-07","2026-12-11"],["G","2026-12-14","2026-12-18"]];
const SCHIET_UREN=["08:00","16:00"];
const SECT={G:{naam:"Grote sector",r:"12 NM",n:3},M:{naam:"Middensector",r:"7,5 NM",n:2},K:{naam:"Kleine sector",r:"2,5 NM",n:1}};
/* seinmast: vierkante rode vlag met 1, 2 of 3 rode ballen erboven */
function flag(n,cls=""){const H=34,top=H-12-n*7.2;let c="";for(let i=0;i<n;i++)c+=`<circle cx="3.5" cy="${top+3+i*7.2}" r="3"/>`;
  return `<svg class="flag ${cls}" viewBox="0 0 16 ${H}" fill="var(--red)"><rect x="2.8" y="${top}" width="1.4" height="${H-top}" fill="#4f4b47"/>${c}<rect x="4.2" y="${H-12}" width="11" height="9"/></svg>`;}
const DGN=["zo","ma","di","wo","do","vr","za"],MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=t=>{const [y,m,d]=t.split("-").map(Number);return new Date(y,m-1,d);};
function periode(a,b){const A=pd(a),B=pd(b);
  if(a===b)return `${DGN[A.getDay()]} ${A.getDate()} ${MND[A.getMonth()]}`;
  return A.getMonth()===B.getMonth()?`${DGN[A.getDay()]} ${A.getDate()} – ${DGN[B.getDay()]} ${B.getDate()} ${MND[B.getMonth()]}`
    :`${DGN[A.getDay()]} ${A.getDate()} ${MND[A.getMonth()]} – ${DGN[B.getDay()]} ${B.getDate()} ${MND[B.getMonth()]}`;}
/* testen: schietsector.html?nu=2026-10-19T10:00 */
const NU_TEST=new URLSearchParams(location.search).get("nu");
function mast(n){const fy=122,cy=[...Array(n)].map((_,i)=>fy-30-i*23),top=Math.min(...cy)-11,bot=Math.max(...cy)+11;
  return `<svg class="vl" viewBox="0 0 110 230" aria-hidden="true"><rect x="14" y="14" width="6" height="216" fill="#a9a59f"/><circle cx="17" cy="11" r="7" fill="#a9a59f"/>`+
    `<path d="M20 17 L31 ${top}M31 ${bot} L20 ${fy}" fill="none" stroke="#a9a59f" stroke-width="1.6"/><g fill="#e5483b">${cy.map(c=>`<circle cx="31" cy="${c}" r="11"/>`).join("")}`+
    `<rect x="20" y="${fy}" width="80" height="58"/></g></svg>`;}
function renderSchiet(){
  const now=NU_TEST?new Date(NU_TEST):new Date(),t=ymd(now),dow=now.getDay(),hm=now.toTimeString().slice(0,5);
  const p=SCHIETPLAN.find(p=>p[1]<=t&&t<=p[2]);
  const actief=p&&dow>0&&dow<6?p:null;
  const bezig=actief&&hm>=SCHIET_UREN[0]&&hm<SCHIET_UREN[1];
  // sector die van toepassing is: vandaag actief, anders de eerstvolgende
  const aan=actief&&hm<SCHIET_UREN[1]?actief:null;
  const vlg=SCHIETPLAN.find(q=>q[1]>t||(q[1]<=t&&t<q[2]&&!aan));
  const rel=aan||vlg;
  $("secAct").setAttribute("d",rel?$("sec"+rel[0]).getAttribute("d"):"");
  $("secIn").classList.toggle("on",!!rel);
  // status, kaart van de sector die van toepassing is, en wat daarna komt
  $("stat").className="stat"+(aan?" on":"");
  $("stat").innerHTML=`<i></i>${aan?"Vandaag schietoefening!":"Vandaag geen oefening"}`;
  $("today").className="today"+(aan?" on":"");
  const dat=rel?(aan?`Vandaag`:periode(rel[1]>t?rel[1]:ymd(new Date(now.getTime()+864e5)),rel[2])):"";
  $("today").innerHTML=rel?`<div class="dt">${dat}</div><div class="big">${SECT[rel[0]].naam}</div>`+
      `<div class="sub">${SCHIET_UREN[0]} – ${SCHIET_UREN[1]}${aan?"<br>Kanaal 74 · SN":""}</div>`+mast(SECT[rel[0]].n)
    :`<div class="dt">Volgende oefening</div><div class="big">Nog niet bekend</div><div class="sub">Nieuwe planning volgt.</div>`;
  const daarna=rel?SCHIETPLAN.filter(q=>q[1]>rel[2]).slice(0,4):[];
  $("plan").parentElement.hidden=!daarna.length;
  $("plan").innerHTML=daarna.map(q=>`<div class="row"><b>${periode(q[1],q[2])}</b><span>${SECT[q[0]].naam}</span></div>`).join("");
}
tick();setInterval(tick,1000);renderSchiet();setInterval(renderSchiet,60*1000);loadWx();setInterval(loadWx,15*60*1000);
setTimeout(()=>location.reload(),6*36e5);
</script>
